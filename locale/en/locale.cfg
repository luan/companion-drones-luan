[technology-description]
companion-crafting-speed=Increase independent crafter speed by 50% of the configured starting speed and add one parallel crafter per companion per level. Applies to crafts already in progress.
companion-planet=Add one parallel crafter per companion and improve movement and crafting speed (+25% of starting crafting speed), combat escort capacity, and construction equipment. Every two completed planet developments grant each player one additional permanent companion.
companion-promethium=Grant each player one additional permanent companion per research level.
