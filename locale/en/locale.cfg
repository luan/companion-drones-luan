[controls]
companion-construction-hotkey=Toggle Companion Construction
companion-attack-hotkey=Toggle Companion Combat
companion-search-hotkey=Debug Reset Companion

[controls-description]
companion-construction-hotkey=Toggle whether the drone constructs, deconstructs, and repairs automatically.
companion-attack-hotkey=Toggle whether the drone deploys disposable combat escorts to defend its owner.
companion-search-hotkey=Force the drone to do a fresh search of the area in the event it locks up and won't respond. Also prints some technical data on the drone's state for debugging purposes.

[settings]
companion-mini-drone-speed=Movement multiplier for combat escorts, task managers and flying crafters. Default: 0.5. Base flight speeds are reduced in 4.1. Changes apply immediately; crafting and task execution speed are unchanged.
companion-work-radius=Distance around the owner to consider construction, repair, upgrade, and deconstruction tasks. Default: 48 tiles. The companion stays close while hidden workers cover this area.
companion-crafting-speed=Recipe speed multiplier before research. Default: 2 (twice base recipe speed). Research bonuses multiply this starting speed.
set-challenge-mode=Legacy challenge-mode alias, retained for existing saves.

companion-voice-lines=Let your companion offer unsolicited factory commentary while its crew is idle.
companion-humor-style=Choose the voice for your companion's future idle quips. Change it during play; no restart required.

set-update-interval=How many ticks do companions wait before checking for new jobs? Lower = more responsive, higher = more performant. Note: setting this very low AND having many companions will probably tank your UPS. Recommend adding at least 2 for each companion you plan to have running simultaneously (i.e. two companions = 7, three = 9, etc). Default: 5

companion-idle-chatter-delay=Maximum random wait in seconds between idle quips. Work, combat, or an unavailable owner restarts the wait. Minimum: 5 seconds, default: 600 (ten minutes).


set-mode=0: Normal, with full starter equipment. 1: Challenge, with equipment and combat improved by ordinary research. Legacy 2 and 3 behave as normal and challenge respectively. Every mode grants a permanent companion; additional companions require planet or promethium research. There are no companion crafting recipes.

